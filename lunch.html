
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1rem 0 1.5rem}
.card-outer{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid #F4C0D1;padding:1.25rem 1.25rem 1rem;position:relative}
.header{text-align:center;margin-bottom:1.25rem}
.header-title{font-size:22px;font-weight:500;color:#72243E;letter-spacing:.04em;margin-bottom:4px}
.live-clock{position:absolute;top:1.25rem;right:1.25rem;font-size:14px;color:#993556;font-weight:500;font-family:'Courier New',monospace;letter-spacing:.5px;background:#FDF4F8;border:0.5px solid #F4C0D1;border-radius:20px;padding:4px 12px}
.header-sub{font-size:13px;color:#993556}
.supervisor-badge{display:inline-block;font-size:12px;font-weight:500;color:#72243E;background:#FDF4F8;border:0.5px solid #F4C0D1;border-radius:20px;padding:4px 14px}
.date-row{display:flex;align-items:center;justify-content:center;gap:8px}
.date-row label{font-size:13px;color:#993556}
.date-row input[type=date]{font-size:13px;padding:4px 10px;border-radius:20px;border:0.5px solid #F4C0D1;background:#FBEAF0;color:#72243E}
.header-info-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:6px;margin-bottom:8px}
.sync-status{font-size:11px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}
.sync-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.sync-status.ok{color:#3B6D11}
.sync-status.ok .dot{background:#6FA52B}
.sync-status.off{color:#993556}
.sync-status.off .dot{background:#D4A0B5}
.sync-status.err{color:#A32D2D}
.sync-status.err .dot{background:#C0392B}
.summary-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:1.25rem}
.sum-chip{background:#FDF4F8;border:0.5px solid #F4C0D1;border-radius:8px;padding:8px 14px;text-align:center;min-width:72px}
.sum-chip.hero{background:#FBEAF0;border-color:#D4537E;min-width:88px}
.sum-chip .cl{font-size:11px;color:#993556;margin-bottom:1px}
.sum-chip .cv{font-size:20px;font-weight:500;color:#72243E}
.sum-chip.hero .cv{font-size:24px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:20px}
.bn{background:#E6F1FB;color:#0C447C}
.bv{background:#EAF3DE;color:#3B6D11}
.bp{background:#FAEEDA;color:#633806}
.bs{background:#EEEDFE;color:#3C3489}
.kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:1rem}
.site-card{border-radius:8px;border:0.5px solid #F4C0D1;padding:10px 12px;background:#FFFBFD;transition:border-color .15s;position:relative}
.site-card:nth-child(even){background:#FDF4F8}
.site-card.has-data{border-color:#D4537E;background:#FFF5F8}
.site-card.is-locked{border-color:#D4537E;background:#FFF0F5}
.site-card .sname{font-size:13px;font-weight:500;color:#72243E;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.site-card .stotal{font-size:18px;font-weight:500;color:#72243E}
.site-card .stotal.zero{font-size:14px;color:#D4A0B5;font-weight:400}
.site-card .rows{display:flex;flex-direction:column;gap:4px}
.site-card .datarow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.site-card .datarow label{font-size:11px;color:#993556;min-width:28px}
.site-card input[type=number]{flex:1;border:0.5px solid #F4C0D1;border-radius:5px;padding:3px 4px;text-align:center;font-size:13px;background:transparent;color:#3C2030;-moz-appearance:textfield;min-width:0}
.site-card input[type=number]::-webkit-outer-spin-button,
.site-card input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.site-card input[type=number]:focus{outline:none;border-color:#D4537E;box-shadow:0 0 0 2px rgba(212,83,126,.12)}
.site-card input[type=number]:disabled{color:#D4A0B5;background:transparent;border-color:#F4C0D1}
.site-card .soup-row{margin-top:6px;padding-top:6px;border-top:0.5px solid #F4C0D1;display:flex;align-items:center;justify-content:space-between;gap:4px}
.site-card .soup-row label{font-size:11px;color:#3C3489}
.site-card .remark-row{margin-top:6px}
.site-card .remark-row input[type=text]{width:100%;border:0.5px solid #F4C0D1;border-radius:5px;padding:4px 6px;font-size:11px;background:transparent;color:#3C2030}
.site-card .remark-row input[type=text]:focus{outline:none;border-color:#D4537E;box-shadow:0 0 0 2px rgba(212,83,126,.12)}
.site-card .remark-row input[type=text]:disabled{color:#D4A0B5;background:transparent;border-color:#F4C0D1}
.site-card .remark-row input[type=text]::placeholder{color:#E3B8C8}
.confirm-btn{width:100%;margin-top:6px;padding:5px 0;border-radius:6px;border:0.5px solid #F4C0D1;background:transparent;color:#993556;font-size:11px;font-weight:500;cursor:pointer;transition:transform .08s}
.confirm-btn:hover{background:#FDF4F8}
.confirm-btn:active{transform:scale(0.95)}
.confirm-btn:disabled{color:#E3B8C8;border-color:#F4C0D1;cursor:default;background:transparent}
.confirm-btn.confirmed{background:#E8F3DC;border-color:#6FA52B;color:#3B6D11;animation:lock-pulse .45s ease-out}
.confirm-btn.confirmed:hover{background:#DCEDC9}
@keyframes lock-pulse{0%{box-shadow:0 0 0 0 rgba(111,165,43,.55);transform:scale(.97)}70%{box-shadow:0 0 0 7px rgba(111,165,43,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(111,165,43,0)}}
.site-card.is-confirmed{border-color:#6FA52B}
.lock-overlay{display:none;position:absolute;inset:0;border-radius:8px;cursor:pointer}
.lock-overlay.show{display:block}
.lock-overlay .lo-badge{position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;background:#FBEAF0;border:1.5px solid #D4537E;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(114,36,62,.25)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.btn{padding:7px 18px;border-radius:20px;border:0.5px solid #F4C0D1;background:#FBEAF0;cursor:pointer;font-size:13px;color:#72243E;font-weight:500}
.btn:hover{background:#F4C0D1}
.btn-save{background:#D4537E;color:#FBEAF0;border-color:#993556}
.btn-save:hover{background:#993556}
.modal-bg{display:none;position:absolute;inset:0;background:rgba(114,36,62,.18);border-radius:12px;align-items:center;justify-content:center;z-index:20}
.modal-bg.show{display:flex}
.modal{background:var(--color-background-primary);border-radius:12px;border:0.5px solid #F4C0D1;padding:1.5rem 1.75rem;text-align:center;min-width:220px;max-width:280px}
.modal h3{font-size:16px;font-weight:500;color:#72243E;margin-bottom:4px}
.modal p{font-size:12px;color:#993556;margin-bottom:1rem}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:.75rem}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #D4537E;background:transparent;transition:background .12s}
.pin-dot.filled{background:#D4537E}
.pin-err{font-size:12px;color:#A32D2D;min-height:16px;margin-bottom:.5rem}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.pin-btn{padding:10px 0;border-radius:8px;border:0.5px solid #F4C0D1;background:#FBEAF0;cursor:pointer;font-size:16px;font-weight:500;color:#72243E}
.pin-btn:hover{background:#F4C0D1}
.modal-cancel{font-size:13px;color:#993556;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:20px}
.modal-cancel:hover{background:#FDF4F8}
.toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#FFF6E5;border:0.5px solid #E0A93C;color:#7A4E08;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:90vw;text-align:center;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateY(0)}
</style>

<div class="wrap">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">平安診所C據點每日便當填報看板</h2>
<div class="card-outer" id="card-outer">

  <div class="live-clock" id="live-clock">00:00:00</div>
  <div class="toast-stack" id="toast-stack"></div>
  <div class="header">
    <div class="header-title">平安診所 C 據點</div>
    <div class="header-info-row">
      <div class="header-sub">每日便當填報</div>
      <div class="supervisor-badge">👤 便當主管　蔡尚文 副區長</div>
      <div class="date-row">
        <label><i class="ti ti-calendar" aria-hidden="true" style="font-size:14px;vertical-align:-1px;margin-right:3px"></i>日期</label>
        <input type="date" id="report-date">
      </div>
    </div>
    <div class="sync-status off" id="sync-status"><span class="dot"></span><span id="sync-status-text">尚未連接雲端</span></div>
  </div>

  <div class="summary-bar">
    <div class="sum-chip"><div class="cl"><span class="badge bn">一般</span></div><div class="cv" id="chip-n">0</div></div>
    <div class="sum-chip"><div class="cl"><span class="badge bv">素食</span></div><div class="cv" id="chip-v">0</div></div>
    <div class="sum-chip"><div class="cl"><span class="badge bp">不豬</span></div><div class="cv" id="chip-p">0</div></div>
    <div class="sum-chip hero"><div class="cl" style="color:#72243E;font-weight:500">便當總計</div><div class="cv" id="chip-total">0</div></div>
    <div class="sum-chip"><div class="cl"><span class="badge bs">湯份</span></div><div class="cv" id="chip-s">0</div></div>
  </div>

  <div class="kanban" id="kanban"></div>

  <div class="actions">
    <button class="btn" onclick="handleExportClick('day')">📊 匯出當日</button>
    <button class="btn" onclick="handleExportClick('month')">📊 匯出整月</button>
    <button class="btn" onclick="handleClearAll()"><i class="ti ti-refresh" aria-hidden="true" style="font-size:15px;vertical-align:-2px;margin-right:4px"></i>清除所有</button>
  </div>

  <div class="modal-bg" id="format-modal-bg">
    <div class="modal">
      <h3 id="format-modal-title">匯出報表</h3>
      <p>選擇要匯出的檔案格式</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:.5rem">
        <button class="btn btn-save" style="width:100%" onclick="confirmExportFormat('xlsx')">📊 試算表（.xlsx）</button>
        <button class="btn" style="width:100%" onclick="confirmExportFormat('image')">🖼️ 圖檔（.png，手機都能直接開）</button>
      </div>
      <button class="modal-cancel" onclick="closeFormatModal()">取消</button>
    </div>
  </div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SITES=['北華村','新店村','官和村','復興里','新岑里','興中里','岱江里','岑海里','西安里','振寮里','考試里','江山里','見龍里','永安里'];

/* ===== 雲端後端設定 =====
   部署 Apps Script 後，把 /exec 結尾的網址貼到下面這行取代預設值。
   貼上正確網址前，此元件會自動以「本機模式」運作（不會報錯，但不同裝置間不會同步）。 */
const GAS_URL='https://script.google.com/macros/s/AKfycbwowK8wt70W_N-UW0NMZOdduuz7FKc0Do0CVdz0ADzzz_eTv33IpHdffVnUAcKpvBBJ/exec';

const backendReady=!!GAS_URL && GAS_URL.indexOf('請貼上')===-1 && GAS_URL.indexOf('exec')!==-1;
const POLL_INTERVAL_MS=7000;
const PUSH_DEBOUNCE_MS=700;

const kanban=document.getElementById('kanban');
const dateInput=document.getElementById('report-date');
function localDateStr(d){
  const yyyy=d.getFullYear();
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
dateInput.value=localDateStr(new Date());

const confirmed={}; // idx -> bool，該據點今天是否已確認並鎖定
const pushTimers={};
const pendingEdit={}; // idx -> bool，該據點是否還有「排隊中／送出中」尚未完成的編輯，避免被自動同步蓋掉
const lastLocalEditAt={}; // idx -> timestamp，最後一次在本機編輯/鎖定這個據點的時間，用來判斷輪詢回應是否已經過期

SITES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='site-card';
  d.dataset.idx=i;
  d.innerHTML=`
    <div class="sname">
      <span>${s}</span>
      <span class="stotal zero" id="rt-${i}">—</span>
    </div>
    <div class="rows">
      <div class="datarow"><label><span class="badge bn">一般</span></label><input type="number" min="0" placeholder="0" data-col="n" data-row="${i}"></div>
      <div class="datarow"><label><span class="badge bv">素食</span></label><input type="number" min="0" placeholder="0" data-col="v" data-row="${i}"></div>
      <div class="datarow"><label><span class="badge bp">不豬</span></label><input type="number" min="0" placeholder="0" data-col="p" data-row="${i}"></div>
    </div>
    <div class="soup-row">
      <label><span class="badge bs">湯份</span></label>
      <input type="number" min="0" placeholder="0" data-col="s" data-row="${i}" style="max-width:60px">
    </div>
    <div class="remark-row">
      <input type="text" placeholder="備註（選填）" data-col="remark" data-row="${i}" maxlength="200">
    </div>
    <button class="confirm-btn" id="confirm-btn-${i}" onclick="handleConfirmToggle(${i})">確認完成</button>
    <div class="lock-overlay" id="overlay-${i}" onclick="handleConfirmToggle(${i})">
      <div class="lo-badge">🔒</div>
    </div>`;
  kanban.appendChild(d);
});

function g(el){return parseInt(el.value)||0;}

function recalc(){
  let tn=0,tv=0,tp=0,ts=0;
  SITES.forEach((_,i)=>{
    const card=kanban.querySelector(`[data-idx="${i}"]`);
    const n=g(card.querySelector('[data-col=n]'));
    const v=g(card.querySelector('[data-col=v]'));
    const p=g(card.querySelector('[data-col=p]'));
    const s=g(card.querySelector('[data-col=s]'));
    const remark=card.querySelector('[data-col=remark]').value.trim();
    const tot=n+v+p;
    const rtEl=document.getElementById(`rt-${i}`);
    rtEl.textContent=tot||'—';
    rtEl.className='stotal'+(tot?'':' zero');
    card.classList.toggle('has-data',!!(tot||s||remark)&&!confirmed[i]);
    tn+=n;tv+=v;tp+=p;ts+=s;
  });
  document.getElementById('chip-n').textContent=tn;
  document.getElementById('chip-v').textContent=tv;
  document.getElementById('chip-p').textContent=tp;
  document.getElementById('chip-s').textContent=ts;
  document.getElementById('chip-total').textContent=tn+tv+tp;
}
kanban.addEventListener('input',e=>{
  recalc();
  const row=e.target?.dataset?.row;
  if(row!==undefined){
    const i=parseInt(row);
    if(confirmed[i]) applyConfirmUI(i,false); // 內容被改動，先取消確認狀態，避免顯示過期的「已確認」
    schedulePush(i);
  }
});

// 防呆①：數字欄位被focus時，滑鼠滾輪滑過去常會不小心把數字加減掉（瀏覽器原生行為），
// 一律讓欄位先失焦，滾輪只用來滾頁面，不會偷改到數字
kanban.addEventListener('wheel',e=>{
  if(e.target.tagName==='INPUT' && e.target.type==='number' && document.activeElement===e.target){
    e.target.blur();
  }
},{passive:true});

function showToast(message,durationMs){
  durationMs=durationMs||4000;
  const stack=document.getElementById('toast-stack');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=message;
  stack.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(),250);
  },durationMs);
}

// 防呆②：一般+素食+不豬 三項合計（不含湯）達到 26，離開欄位時跳出提醒（不會擋住輸入或畫面操作，幾秒後自動消失）
const SUM_WARN_THRESHOLD=26;
kanban.addEventListener('focusout',e=>{
  const col=e.target?.dataset?.col;
  if(e.target.tagName==='INPUT' && e.target.type==='number' && (col==='n'||col==='v'||col==='p')){
    const card=e.target.closest('.site-card');
    const n=g(card.querySelector('[data-col=n]'));
    const v=g(card.querySelector('[data-col=v]'));
    const p=g(card.querySelector('[data-col=p]'));
    const sum=n+v+p;
    if(sum>=SUM_WARN_THRESHOLD){
      const siteName=card.querySelector('.sname span').textContent;
      showToast(`「${siteName}」一般＋素食＋不豬 合計已達 ${sum}（不含湯份），請確認數量是否正確。`);
    }
  }
});

/* ===== 雲端同步：GAS 通訊 ===== */
async function gasGet(params){
  if(!backendReady) return null;
  try{
    const qs=new URLSearchParams(params).toString();
    const res=await fetch(`${GAS_URL}?${qs}`);
    return await res.json();
  }catch(err){
    console.error('GAS GET 失敗',err);
    setSyncStatus('err','連線失敗');
    return null;
  }
}

async function gasPost(body){
  if(!backendReady) return null;
  try{
    const res=await fetch(GAS_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body)
    });
    return await res.json();
  }catch(err){
    console.error('GAS POST 失敗',err);
    setSyncStatus('err','連線失敗');
    return null;
  }
}

function setSyncStatus(kind,text){
  const el=document.getElementById('sync-status');
  el.className='sync-status '+kind;
  document.getElementById('sync-status-text').textContent=text;
}

function schedulePush(i){
  pendingEdit[i]=true;
  lastLocalEditAt[i]=Date.now();
  clearTimeout(pushTimers[i]);
  pushTimers[i]=setTimeout(()=>pushSite(i),PUSH_DEBOUNCE_MS);
}

async function pushSite(i){
  if(!backendReady||confirmed[i]){ pendingEdit[i]=false; return; }
  const card=kanban.querySelector(`[data-idx="${i}"]`);
  const n=g(card.querySelector('[data-col=n]'));
  const v=g(card.querySelector('[data-col=v]'));
  const p=g(card.querySelector('[data-col=p]'));
  const s=g(card.querySelector('[data-col=s]'));
  const remark=card.querySelector('[data-col=remark]').value;
  const res=await gasPost({action:'update',date:dateInput.value,site:SITES[i],n,v,p,s,remark});
  pendingEdit[i]=false;
  if(res&&res.ok){ setSyncStatus('ok','已同步'); }
  else if(res&&res.error==='locked'){
    // 這個據點剛好被鎖定（競爭狀況），這筆資料沒有送出，明確告知使用者
    setSyncStatus('err','剛才的輸入未送出（此據點已鎖定）');
    alert(`「${SITES[i]}」剛剛輸入的數量沒有送出，因為這個據點目前已被鎖定。請重新整理頁面確認目前狀態，需要密碼解鎖後再輸入一次。`);
    loadDate(dateInput.value);
  } else {
    setSyncStatus('err','同步失敗，請檢查網路');
  }
}

function applyCardLockUI(i,isLocked){
  confirmed[i]=isLocked;
  const card=kanban.querySelector(`[data-idx="${i}"]`);
  const btn=document.getElementById(`confirm-btn-${i}`);
  card.classList.toggle('is-confirmed',isLocked);
  card.classList.toggle('is-locked',isLocked);
  btn.classList.toggle('confirmed',isLocked);
  btn.textContent=isLocked?'🔒 已鎖定':'確認完成';
  card.querySelectorAll('input').forEach(inp=>inp.disabled=isLocked);
  document.getElementById(`overlay-${i}`).classList.toggle('show',isLocked);
  recalc();
}

async function handleConfirmToggle(i){
  if(confirmed[i]){
    // 據點本身沒有解鎖權限，要修改請洽主管，主管在「主管專用頁」操作解鎖
    showToast(`「${SITES[i]}」已鎖定。如需修改，請洽 蔡尚文 副區長協助解鎖。`);
    return;
  }
  await doLockSite(i);
}

async function doLockSite(i){
  lastLocalEditAt[i]=Date.now();
  clearTimeout(pushTimers[i]); // 取消還在排隊中的舊版更新，避免跟鎖定互相競爭
  const card=kanban.querySelector(`[data-idx="${i}"]`);
  const n=g(card.querySelector('[data-col=n]'));
  const v=g(card.querySelector('[data-col=v]'));
  const p=g(card.querySelector('[data-col=p]'));
  const s=g(card.querySelector('[data-col=s]'));
  const remark=card.querySelector('[data-col=remark]').value;
  applyCardLockUI(i,true); // 先樂觀鎖定畫面，點下去馬上有反應，不用等網路往返
  pendingEdit[i]=true;
  if(backendReady){
    const res=await gasPost({action:'siteLock',date:dateInput.value,site:SITES[i],n,v,p,s,remark});
    pendingEdit[i]=false;
    if(res&&res.ok){
      setSyncStatus('ok','已同步');
    } else {
      applyCardLockUI(i,false); // 失敗就復原成未鎖定
      alert('鎖定失敗，請確認網路連線後再試一次。');
    }
  } else {
    pendingEdit[i]=false;
  }
}

async function loadDate(date){
  if(!backendReady){ setSyncStatus('off','尚未連接雲端'); return; }
  setSyncStatus('ok','讀取中…');
  const pollSentAt=Date.now();
  const res=await gasGet({action:'pull',date});
  if(!res||!res.ok){ setSyncStatus('err','讀取失敗，稍後自動重試'); return; }
  applyServerData(res.data,true,pollSentAt);
  setSyncStatus('ok','已連接雲端，即時同步中');
}

async function refreshFromServer(){
  if(!backendReady) return;
  const pollSentAt=Date.now();
  const res=await gasGet({action:'pull',date:dateInput.value});
  if(!res||!res.ok) return;
  applyServerData(res.data,false,pollSentAt);
  setSyncStatus('ok','已連接雲端，即時同步中');
}

function applyServerData(dataObj,fullReplace,pollSentAt){
  SITES.forEach((s,i)=>{
    const rec=dataObj[s];
    const card=kanban.querySelector(`[data-idx="${i}"]`);
    const inputs={
      n:card.querySelector('[data-col=n]'),
      v:card.querySelector('[data-col=v]'),
      p:card.querySelector('[data-col=p]'),
      s:card.querySelector('[data-col=s]'),
      remark:card.querySelector('[data-col=remark]')
    };
    const anyFocused=Object.values(inputs).some(el=>el===document.activeElement);
    // 如果這次輪詢「送出」之後，這個據點又發生過新的本機編輯/鎖定，這次的回應已經過期，不能套用，
    // 否則會把剛改好的資料蓋回送出輪詢當時的舊狀態（即使那筆編輯早就送完、pendingEdit 已經清掉）
    const respondedAfterNewerEdit=pollSentAt!==undefined&&lastLocalEditAt[i]&&lastLocalEditAt[i]>pollSentAt;
    const hasPendingEdit=anyFocused||!!pendingEdit[i]||respondedAfterNewerEdit;
    if(rec){
      if(fullReplace||!hasPendingEdit){
        inputs.n.value=rec.n||'';
        inputs.v.value=rec.v||'';
        inputs.p.value=rec.p||'';
        inputs.s.value=rec.s||'';
        inputs.remark.value=rec.remark||'';
        if(!!confirmed[i]!==!!rec.locked) applyCardLockUI(i,!!rec.locked);
      }
    } else if(fullReplace){
      inputs.n.value='';inputs.v.value='';inputs.p.value='';inputs.s.value='';inputs.remark.value='';
      if(confirmed[i]) applyCardLockUI(i,false);
    }
  });
  recalc();
}

async function handleClearAll(){
  const targets=SITES.map((_,i)=>i).filter(i=>!confirmed[i]);
  const lockedCount=SITES.length-targets.length;
  if(targets.length===0){
    alert('所有據點目前都已鎖定，沒有可以清除的項目。');
    return;
  }
  const msg=lockedCount>0
    ?`確定清除「未鎖定」的 ${targets.length} 個據點的數量與備註？（已鎖定的 ${lockedCount} 個據點不會被清除）`
    :'確定清除所有據點的數量與備註？'+(backendReady?'（雲端紀錄也會一併清除）':'');
  if(confirm(msg)){
    targets.forEach(i=>{
      const card=kanban.querySelector(`[data-idx="${i}"]`);
      card.querySelectorAll('input').forEach(el=>{ el.value=''; });
    });
    recalc();
    if(backendReady){
      const tasks=targets.map(i=>gasPost({action:'update',date:dateInput.value,site:SITES[i],n:0,v:0,p:0,s:0,remark:''}));
      await Promise.all(tasks);
    }
  }
}

async function fetchExportRows(scope,btnLabel){
  if(!backendReady){
    alert('尚未連接雲端後端，目前沒有歷史紀錄可匯出。請先完成 Google 試算表連接設定。');
    return null;
  }
  const btn=[...document.querySelectorAll('.btn')].find(b=>b.textContent.includes(btnLabel));
  const orig=btn?btn.innerHTML:null;
  if(btn) btn.innerHTML='匯出中…';
  const res=await gasGet({action:'pullAll'});
  if(btn) btn.innerHTML=orig;
  if(!res||!res.ok){
    alert('無法取得雲端歷史資料，請確認網路連線後再試一次。');
    return null;
  }
  const curDate=dateInput.value;         // yyyy-mm-dd
  const curMonth=curDate.slice(0,7);     // yyyy-mm
  let rows=res.rows.filter(r=>scope==='day'?r.date===curDate:r.date.slice(0,7)===curMonth);
  if(rows.length===0){
    alert(scope==='day'?'這一天目前沒有任何紀錄。':'這個月目前沒有任何紀錄。');
    return null;
  }
  const siteOrder=Object.fromEntries(SITES.map((s,i)=>[s,i]));
  rows=rows.slice().sort((a,b)=>{
    if(a.date!==b.date) return a.date.localeCompare(b.date);
    return (siteOrder[a.site]??999)-(siteOrder[b.site]??999);
  });
  return rows;
}

function numOf(v){ const n=Number(v); return isNaN(n)?0:n; }
function strOf(v){ return v==null?'':String(v).trim(); }

function buildReportAOA(rows){
  const header=['日期','據點','一般','素食','不豬','便當合計','湯份','備註','確認狀態','最後更新'];
  const aoa=[header];
  let idx=0;
  while(idx<rows.length){
    const curRowDate=rows[idx].date;
    let tn=0,tv=0,tp=0,ts=0;
    while(idx<rows.length && rows[idx].date===curRowDate){
      const r=rows[idx];
      const n=numOf(r.n),v=numOf(r.v),p=numOf(r.p),s=numOf(r.s);
      const tot=n+v+p;
      aoa.push([r.date,r.site,n,v,p,tot,s,strOf(r.remark),r.confirmed?'已確認':'',strOf(r.updated_at)]);
      tn+=n;tv+=v;tp+=p;ts+=s;
      idx++;
    }
    aoa.push([curRowDate,'合計',tn,tv,tp,tn+tv+tp,ts,'','','']);
  }
  return aoa;
}

function buildMonthlySummaryAOA(rows){
  // 整月報表：每個據點一列（一般/素食/不豬/便當合計/湯份為整月加總，備註合併保留同一據點當月所有備註），
  // 最後加一行「合計」彙總全部據點
  const header=['據點','一般','素食','不豬','便當合計','湯份','備註'];
  const aoa=[header];
  const bySite={};
  rows.forEach(r=>{
    if(!bySite[r.site]) bySite[r.site]={n:0,v:0,p:0,s:0,remarks:[]};
    bySite[r.site].n+=numOf(r.n);
    bySite[r.site].v+=numOf(r.v);
    bySite[r.site].p+=numOf(r.p);
    bySite[r.site].s+=numOf(r.s);
    const remarkText=strOf(r.remark);
    if(remarkText) bySite[r.site].remarks.push(remarkText);
  });
  const orderedSites=[...SITES,...Object.keys(bySite).filter(s=>!SITES.includes(s))];
  let gn=0,gv=0,gp=0,gs=0;
  orderedSites.forEach(site=>{
    const agg=bySite[site];
    if(!agg) return;
    aoa.push([site,agg.n,agg.v,agg.p,agg.n+agg.v+agg.p,agg.s,agg.remarks.join('；')]);
    gn+=agg.n;gv+=agg.v;gp+=agg.p;gs+=agg.s;
  });
  aoa.push(['合計',gn,gv,gp,gn+gv+gp,gs,'']);
  return aoa;
}

function monthlyTitleText(curMonth){
  const monthNum=parseInt(curMonth.split('-')[1],10);
  return `${monthNum}月份便當明細表`;
}

async function doExportExcel(scope){
  const label=scope==='day'?'匯出當日':'匯出整月';
  const rows=await fetchExportRows(scope,label);
  if(!rows) return;
  if(typeof XLSX==='undefined'){
    alert('Excel 匯出元件載入失敗，請確認網路連線後重新整理頁面再試一次。');
    return;
  }
  try{
    const curDate=dateInput.value,curMonth=curDate.slice(0,7);
    let aoa=scope==='month'?buildMonthlySummaryAOA(rows):buildReportAOA(rows);
    if(scope==='month'){
      aoa=[[monthlyTitleText(curMonth),'','','','','',''],...aoa];
    }
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=scope==='month'
      ?[{wch:10},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:24}]
      :[{wch:11},{wch:8},{wch:7},{wch:7},{wch:7},{wch:9},{wch:7},{wch:22},{wch:9},{wch:18}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'便當記錄');
    const suffix=scope==='day'?`當日_${curDate}`:`整月_${curMonth}`;
    XLSX.writeFile(wb,`便當填報_C據點_${suffix}.xlsx`);
  }catch(err){
    console.error('Excel 匯出失敗',err);
    alert('匯出 Excel 時發生錯誤，請稍後再試一次；如持續發生請回報此訊息：'+(err&&err.message?err.message:err));
  }
}

function fitText(ctx,text,maxWidth){
  text=String(text??'');
  if(ctx.measureText(text).width<=maxWidth) return text;
  let t=text;
  while(t.length>0&&ctx.measureText(t+'…').width>maxWidth) t=t.slice(0,-1);
  return t+'…';
}

function buildReportCanvas(aoa,titleText,colWidths){
  colWidths=colWidths||[92,68,46,46,46,68,46,150,58,118];
  const rowH=30,headerH=36,titleH=42,pad=16;
  const innerWidth=colWidths.reduce((a,b)=>a+b,0);
  const width=innerWidth+pad*2;
  const height=titleH+headerH+(aoa.length-1)*rowH+pad*2;
  const scale=2;
  const canvas=document.createElement('canvas');
  canvas.width=width*scale;
  canvas.height=height*scale;
  const ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,width,height);
  ctx.textBaseline='middle';
  ctx.font='bold 17px "Noto Sans TC","Microsoft JhengHei",sans-serif';
  ctx.fillStyle='#72243E';
  ctx.textAlign='left';
  ctx.fillText(titleText,pad,pad+titleH/2-4);

  function drawRow(rowData,rowY,rowHeight,opts){
    opts=opts||{};
    let x=pad;
    rowData.forEach((cell,ci)=>{
      const w=colWidths[ci];
      if(opts.bg){ ctx.fillStyle=opts.bg; ctx.fillRect(x,rowY,w,rowHeight); }
      ctx.strokeStyle='#F4C0D1';
      ctx.lineWidth=1;
      ctx.strokeRect(x+0.5,rowY+0.5,w-1,rowHeight-1);
      ctx.font=(opts.bold?'bold ':'')+'12px "Noto Sans TC","Microsoft JhengHei",sans-serif';
      ctx.fillStyle=opts.color||'#3C2030';
      ctx.textAlign='center';
      ctx.fillText(fitText(ctx,cell,w-8),x+w/2,rowY+rowHeight/2);
      x+=w;
    });
  }

  let y=pad+titleH;
  ctx.fillStyle='#FBEAF0';
  ctx.fillRect(pad,y,innerWidth,headerH);
  drawRow(aoa[0],y,headerH,{bold:true,color:'#72243E'});
  y+=headerH;
  for(let r=1;r<aoa.length;r++){
    const isTotalRow=aoa[r][0]==='合計'||aoa[r][1]==='合計';
    drawRow(aoa[r],y,rowH,isTotalRow?{bg:'#FDF4F8',bold:true,color:'#72243E'}:{});
    y+=rowH;
  }
  return canvas;
}

async function doExportImage(scope){
  const label=scope==='day'?'匯出當日':'匯出整月';
  const rows=await fetchExportRows(scope,label);
  if(!rows) return;
  try{
    const aoa=scope==='month'?buildMonthlySummaryAOA(rows):buildReportAOA(rows);
    const colWidths=scope==='month'?[90,60,60,60,80,60,160]:undefined;
    const curDate=dateInput.value,curMonth=curDate.slice(0,7);
    const titleText=scope==='day'?`便當填報 C據點　${curDate}`:monthlyTitleText(curMonth);
    const canvas=buildReportCanvas(aoa,titleText,colWidths);
    canvas.toBlob(blob=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      const suffix=scope==='day'?`當日_${curDate}`:`整月_${curMonth}`;
      a.download=`便當填報_C據點_${suffix}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    },'image/png');
  }catch(err){
    console.error('圖檔匯出失敗',err);
    alert('匯出圖檔時發生錯誤，請稍後再試一次；如持續發生請回報此訊息：'+(err&&err.message?err.message:err));
  }
}

let exportScopePending=null;

function handleExportClick(scope){
  exportScopePending=scope;
  document.getElementById('format-modal-title').textContent=scope==='day'?'匯出當日報表':'匯出整月報表';
  document.getElementById('format-modal-bg').classList.add('show');
}

function closeFormatModal(){
  document.getElementById('format-modal-bg').classList.remove('show');
  exportScopePending=null;
}

async function confirmExportFormat(fmt){
  const scope=exportScopePending;
  closeFormatModal();
  if(!scope) return;
  if(fmt==='xlsx') await doExportExcel(scope);
  else await doExportImage(scope);
}

dateInput.addEventListener('change',()=>loadDate(dateInput.value));

function updateClock(){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('live-clock').textContent=`${hh}:${mm}:${ss}`;
}

updateClock();
setInterval(updateClock,1000);

if(backendReady){
  loadDate(dateInput.value);
  setInterval(refreshFromServer,POLL_INTERVAL_MS);
} else {
  setSyncStatus('off','尚未連接雲端（本機模式）');
}
