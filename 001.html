<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平安診所岱江里C據點｜收支明細系統（附照片）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  --ink:      #1a1a2e;
  --ink2:     #2d3561;
  --gold:     #c9a84c;
  --gold-lt:  #e8d5a3;
  --cream:    #faf7f0;
  --cream2:   #f0ebe0;
  --teal:     #0d7377;
  --teal-lt:  #e8f4f4;
  --red:      #c0392b;
  --green:    #1d6a40;
  --green-lt: #e8f5ee;
  --border:   #d4c9b0;
  --shadow:   0 2px 16px rgba(26,26,46,.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}

/* ── Header ── */
.site-header {
  background: var(--ink);
  color: var(--cream);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 64px;
  border-bottom: 3px solid var(--gold);
  position: sticky; top: 0; z-index: 100;
}
.site-logo {
  width: 38px; height: 38px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif;
  font-size: 18px; color: var(--gold);
  flex-shrink: 0;
}
.site-title-group { flex: 1; }
.site-title { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 700; letter-spacing: .08em; color: var(--cream); }
.site-sub   { font-size: 11px; color: var(--gold-lt); letter-spacing: .12em; margin-top: 1px; }
.header-meta { font-size: 12px; color: #aaa; text-align: right; line-height: 1.6; }

/* ── Layout ── */
.app-body { display: flex; min-height: calc(100vh - 64px); }

.sidebar {
  width: 200px; flex-shrink: 0;
  background: var(--ink2);
  padding: 20px 0;
  display: flex; flex-direction: column; gap: 2px;
}
.sidebar-label {
  font-size: 10px; letter-spacing: .15em; color: #889;
  padding: 12px 18px 4px; text-transform: uppercase;
}
.month-btn {
  display: block; width: 100%;
  padding: 9px 18px;
  background: none; border: none; cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px; color: #bbb;
  transition: background .15s, color .15s;
}
.month-btn:hover { background: rgba(201,168,76,.12); color: var(--gold-lt); }
.month-btn.active { background: var(--gold); color: var(--ink); font-weight: 700; }
.sidebar-add {
  margin: 12px 14px 0;
  padding: 8px;
  background: none;
  border: 1px dashed #556;
  color: #889; font-size: 12px; cursor: pointer;
  border-radius: 4px;
  transition: border-color .15s, color .15s;
}
.sidebar-add:hover { border-color: var(--gold); color: var(--gold); }

/* ── Main content ── */
.main-area { flex: 1; padding: 24px; overflow-x: auto; }

.sheet-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
}
.sheet-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px; font-weight: 700; color: var(--ink2);
}
.sheet-title span { color: var(--gold); }
.sheet-org { font-size: 12px; color: #888; margin-top: 4px; }

.summary-bar {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
}
.summary-card {
  flex: 1; min-width: 140px;
  background: white; border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; color: #888; letter-spacing: .08em; }
.summary-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.card-income .value { color: var(--green); }
.card-expense .value { color: var(--red); }
.card-balance .value { color: var(--teal); }
.card-balance.negative .value { color: var(--red); }

/* ── Toolbar ── */
.toolbar {
  display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.btn {
  padding: 7px 16px; border-radius: 5px; border: none; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; font-size: 13px;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--ink2); color: white; }
.btn-primary:hover { opacity: .85; }
.btn-gold { background: var(--gold); color: var(--ink); font-weight: 700; }
.btn-gold:hover { opacity: .85; }
.btn-outline { background: white; border: 1px solid var(--border); color: var(--ink2); }
.btn-outline:hover { background: var(--cream2); }
.btn-danger { background: #fdf0ee; border: 1px solid #e8c5bf; color: var(--red); }
.btn-danger:hover { background: #fce0dc; }

/* ── Table ── */
.table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: var(--shadow); }
table {
  width: 100%; border-collapse: collapse;
  background: white; font-size: 13px;
  min-width: 900px;
}
thead tr { background: var(--ink2); }
th {
  padding: 10px 8px; color: var(--gold-lt);
  font-weight: 500; font-size: 12px; letter-spacing: .06em;
  text-align: center; white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.08);
}
th:last-child { border-right: none; }
tbody tr { border-bottom: 1px solid #eee; transition: background .12s; }
tbody tr:hover { background: var(--cream); }
tbody tr.carry-row { background: #f0f7ff; font-weight: 500; }
tbody tr.income-row { background: #f0faf4; }
tbody tr.subtotal-row { background: var(--cream2); font-weight: 700; border-top: 2px solid var(--border); border-bottom: 2px solid var(--border); }
td {
  padding: 7px 8px; border-right: 1px solid #eee;
  vertical-align: middle;
}
td:last-child { border-right: none; }
.td-date   { text-align: center; white-space: nowrap; width: 80px; }
.td-voucher{ white-space: nowrap; font-size: 11px; color: #666; }
.td-amt    { text-align: right; font-variant-numeric: tabular-nums; width: 80px; }
.td-qty    { text-align: center; width: 48px; }
.td-price  { text-align: right; width: 60px; }
.td-note   { font-size: 12px; color: #666; }
.td-income { color: var(--green); font-weight: 600; }
.td-expense{ color: var(--red); }
.td-balance{ font-weight: 700; color: var(--teal); }
.td-balance.neg { color: var(--red); }
.td-actions { text-align: center; width: 64px; }

.icon-btn {
  background: none; border: none; cursor: pointer; padding: 3px 5px;
  border-radius: 4px; font-size: 14px; opacity: .6; transition: opacity .15s;
}
.icon-btn:hover { opacity: 1; background: #f0f0f0; }

/* ── Modal ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(10,10,20,.55); backdrop-filter: blur(3px);
  z-index: 200; align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: white; border-radius: 12px;
  padding: 28px 28px 24px;
  width: 560px; max-width: 96vw; max-height: 92vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,.22);
  animation: slide-up .22s ease;
}
@keyframes slide-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 18px; font-weight: 700; color: var(--ink2);
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 2px solid var(--gold);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
label { font-size: 12px; color: #666; font-weight: 500; }
input, select, textarea {
  padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink); background: white;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(13,115,119,.12);
}
textarea { resize: vertical; min-height: 60px; }
.form-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 4px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* ── Print ── */
.sheet-footer {
  margin-top: 20px; padding: 12px 0;
  border-top: 1px solid var(--border);
  font-size: 13px; color: #666;
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}

/* ── Empty state ── */
.empty-row td { text-align: center; padding: 32px; color: #aaa; font-size: 13px; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .sidebar { width: 56px; }
  .month-btn { padding: 10px; font-size: 11px; writing-mode: vertical-rl; }
  .sidebar-label { display: none; }
  .main-area { padding: 12px; }
}

.td-photo { text-align:center; width:60px; vertical-align:middle; }
.photo-modal-bg {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.85); z-index:300;
  align-items:center; justify-content:center;
}
.photo-modal-bg.open { display:flex; }
.photo-modal-bg img { max-width:90vw; max-height:90vh; border-radius:8px; }
.photo-modal-bg .close-btn {
  position:absolute; top:16px; right:20px;
  color:white; font-size:28px; cursor:pointer; line-height:1;
}

@media print {
  .sidebar, .toolbar, .td-actions, th:last-child, .site-header { display: none !important; }
  .main-area { padding: 0; }
  .app-body { display: block; }
  table { font-size: 11px; }
  .modal-bg { display: none !important; }
  body { background: white; }
  .summary-card { box-shadow: none; border: 1px solid #ccc; }
}
</style>

<!-- Header -->
<header class="site-header">
  <div class="site-logo">平</div>
  <div class="site-title-group">
    <div class="site-title">平安診所岱江里C據點</div>
    <div class="site-sub">收支明細管理系統</div>
  </div>
  <div id="syncStatus" style="font-size:11px;color:#aaa;margin-right:12px">⏳ 連線中…</div>
  <div class="header-meta" id="headerMeta"></div>
</header>

<div class="app-body">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">

  <!-- Main -->

      </div>

    <!-- Summary -->
    <div class="summary-bar">
      <div class="summary-card card-income">
        <div class="label">本月收入</div>
        <div class="value" id="sumIncome">—</div>
      </div>
      <div class="summary-card card-expense">
        <div class="label">本月支出</div>
        <div class="value" id="sumExpense">—</div>
      </div>
      <div class="summary-card card-balance" id="balCard">
        <div class="label">期末結餘</div>
        <div class="value" id="sumBalance">—</div>
      </div>
      <div class="summary-card">
        <div class="label">期初結餘</div>

    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn btn-gold" onclick="openAdd()">＋ 新增明細</button>

            <th>日期</th>
            <th>憑證編號</th>
            <th>憑證金額</th>
            <th>摘要</th>
            <th>數量</th>

            <th>收入金額</th>
            <th>支出金額</th>
            <th>結餘</th>
            <th>備註</th>
            <th>佐證照片</th>
            <th class="no-print">操作</th>
          </tr>
        </thead>
        <tbody id="ledgerBody">
          <tr class="empty-row"><td colspan="11">請先從左側選擇或新增月份</td></tr>
        </tbody>
        <tfoot id="ledgerFoot"></tfoot>
      </table>
    </div>

    <div class="sheet-footer" id="sheetFooter"></div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="entryModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">新增明細</div>
    <div class="form-grid">
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="form-group">
        <label>類型</label>
        <select id="fType" onchange="onTypeChange()">
          <option value="expense">支出</option>
          <option value="income">收入（零用金／補助）</option>
          <option value="note">備查（贊助 / 不動帳）</option>
        </select>
      </div>
      <div class="form-group full">
        <label>摘要</label>
        <input type="text" id="fDesc" placeholder="品項名稱或說明">
      </div>
      <div class="form-group">
        <label>憑證編號</label>
        <input type="text" id="fVoucher" placeholder="如 RW42145542 或 無">
      </div>
      <div class="form-group">
        <label>憑證金額</label>
        <input type="number" id="fVoucherAmt" min="0" placeholder="0">
      </div>
      <div class="form-group" id="grpQty">
        <label>數量</label>
        <input type="number" id="fQty" min="0" placeholder="1" oninput="calcAmt()">
      </div>
      <div class="form-group" id="grpPrice">
        <label>單價</label>
        <input type="number" id="fPrice" min="0" placeholder="0" oninput="calcAmt()">
      </div>
      <div class="form-group" id="grpAmt">
        <label id="amtLabel">金額（自動計算）</label>
        <input type="number" id="fAmt" min="0" placeholder="0">
      </div>
      <div class="form-group full">
        <label>備註</label>
        <input type="text" id="fNote" placeholder="附記說明">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('entryModal')">取消</button>
      <button class="btn btn-gold" onclick="saveEntry()">儲存</button>
    </div>
  </div>
</div>

<!-- Carry Modal -->
<div class="modal-bg" id="carryModal">
  <div class="modal" style="width:360px">
    <div class="modal-title">設定期初結餘</div>
    <div class="form-group">
      <label>上月結餘（元）</label>
      <input type="number" id="fCarry" placeholder="0">
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>上月說明</label>
      <input type="text" id="fCarryLabel" placeholder="如：5月份結餘">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('carryModal')">取消</button>
      <button class="btn btn-gold" onclick="saveCarry()">確定</button>
    </div>
  </div>
</div>

<!-- Add Month Modal -->
<div class="modal-bg" id="addMonthModal">
  <div class="modal" style="width:360px">
    <div class="modal-title">新增月份帳冊</div>
    <div class="form-grid">
      <div class="form-group">
        <label>民國年</label>
        <input type="number" id="mYear" placeholder="115" min="100" max="200">
      </div>
      <div class="form-group">
        <label>月份</label>
        <select id="mMonth">
          <option>1</option><option>2</option><option>3</option>

        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addMonthModal')">取消</button>
      <button class="btn btn-gold" onclick="confirmAddMonth()">建立</button>
    </div>
  </div>
</div>

// localStorage wrapper - falls back to memory if blocked (e.g. file://)
const _memStore = {};
const storage = {
  getItem(k) { try { return localStorage.getItem(k); } catch(e) { return _memStore[k]||null; } },
  setItem(k,v) { try { localStorage.setItem(k,v); } catch(e) { _memStore[k]=v; } }
};

// ── Firebase Realtime Database ──────────────────────────────────────────────
const firebaseConfig = {

  appId: "1:452327201296:web:ac04fc2125c873b64c4895"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();
const FB_PATH = 'daijiangli/ledger_photo';
let fbReady = false;
let fbSyncTimer = null;

let db = JSON.parse(storage.getItem(KEY) || '{}');
// db = { ... }

// Firebase stores empty arrays as null - normalize on load
function normalizeDb() {
  Object.keys(db).forEach(k => {
    const sheet = db[k];
    if (!sheet) return;
    // entries: null → [], object (Firebase converts array to object) → array
    if (!sheet.entries || typeof sheet.entries !== 'object') {
      sheet.entries = [];
    } else if (!Array.isArray(sheet.entries)) {
      // Firebase may convert array to {0:{...}, 1:{...}} object
      sheet.entries = Object.values(sheet.entries);
    }
  });
}

function save() {
  storage.setItem(KEY, JSON.stringify(db));
  // Push to Firebase immediately (no debounce) so closing the page right
  // after entry doesn't lose data
  if (fbReady) {
    pendingSync = true;
    if (window._fbWriteLock) window._fbWriteLock(true);
    fbDb.ref(FB_PATH).set(db)
      .then(() => {
        pendingSync = false;
        setSyncStatus('✓ 已同步至雲端', '#7bed9f');
        setTimeout(() => { if (window._fbWriteLock) window._fbWriteLock(false); }, 2000);
      })
      .catch(err => {
        pendingSync = false;
        setSyncStatus('✗ 同步失敗：' + err.message, '#ff6b6b');
        if (window._fbWriteLock) window._fbWriteLock(false);
      });
  }
}

let pendingSync = false;
window.addEventListener('beforeunload', function(e) {
  if (pendingSync) {
    e.preventDefault();
    e.returnValue = '資料正在同步至雲端，請稍候再離開';
    return e.returnValue;
  }
});

function setSyncStatus(msg, color) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.style.color = color || '#aaa'; }
}

// ── State ──────────────────────────────────────────────────────────────────
let currentKey = null;
let editId = null;

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  renderSidebar();
  // Auto-select latest month
  const keys = sortedKeys();
  if (keys.length) selectMonth(keys[keys.length - 1]);
  updateHeaderTime();
}

function updateHeaderTime() {
  const now = new Date();
  document.getElementById('headerMeta').innerHTML =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日<br>雲端同步已啟用`;
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function sortedKeys() {
  return Object.keys(db).sort((a, b) => {
    const [ay, am] = a.split('-').map(Number);
    const [by, bm] = b.split('-').map(Number);
    return ay !== by ? ay - by : am - bm;
  });
}

function keyLabel(k) {
  const [y, m] = k.split('-');
  return `${y}年${m}月`;
}

function renderSidebar() {
  const list = document.getElementById('monthList');
  list.innerHTML = '';
  sortedKeys().forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (k === currentKey ? ' active' : '');
    btn.textContent = keyLabel(k);
    btn.onclick = () => selectMonth(k);
    list.appendChild(btn);
  });
}

function selectMonth(k) {
  currentKey = k;
  renderSidebar();
  renderSheet();
}

// ── Sheet render ───────────────────────────────────────────────────────────
function renderSheet() {
  if (!currentKey) return;
  const [y, m] = currentKey.split('-');
  document.getElementById('sheetTitle').innerHTML =
    `民國 <span>${y}</span> 年 <span>${m}</span> 月 收支明細`;

  const sheet = db[currentKey];
  const entries = [...(Array.isArray(sheet.entries) ? sheet.entries : [])].sort((a, b) => a.date.localeCompare(b.date));
  const body = document.getElementById('ledgerBody');
  body.innerHTML = '';

  // ── Carry row ──
  const carryTr = document.createElement('tr');
  carryTr.className = 'carry-row';
  carryTr.innerHTML = `
    <td class="td-date"></td>
    <td class="td-voucher"></td>
    <td class="td-amt"></td>
    <td>${sheet.carryLabel || '上月結餘'}</td>
    <td></td><td></td>
    <td class="td-amt td-income">${sheet.carry >= 0 ? fmt(sheet.carry) : ''}</td>
    <td class="td-amt"></td>
    <td class="td-amt td-balance ${sheet.carry < 0 ? 'neg' : ''}">${fmt(sheet.carry)}</td>
    <td></td>
    <td class="td-actions"><button class="icon-btn" onclick="openCarry()" title="編輯">✎</button></td>`;
  body.appendChild(carryTr);

  // ── Entry rows ──
  // 逐列結餘扣憑證金額；支出金額欄顯示數量×單價
  function vAmt(e) { return e.voucherAmt || 0; }

  let runBal = sheet.carry;
  entries.forEach(e => {
    if (e.type === 'income')  runBal += e.amt;
    else if (e.type === 'expense') runBal -= vAmt(e);

    const tr = document.createElement('tr');
    tr.className = e.type === 'income' ? 'income-row' : '';
    const d = e.date ? new Date(e.date + 'T00:00:00') : null;
    const dateStr = d ? `${d.getMonth()+1}月${d.getDate()}日` : '';
    const incomeCell = e.type === 'income'
      ? `<td class="td-amt td-income">${fmt(e.amt)}</td><td class="td-amt"></td>`
      : `<td class="td-amt"></td><td class="td-amt td-expense">${e.amt ? fmt(e.amt) : ''}</td>`;
    tr.innerHTML = `
      <td class="td-date">${dateStr}</td>
      <td class="td-voucher">${e.voucher || ''}</td>
      <td class="td-amt">${e.voucherAmt ? fmt(e.voucherAmt) : ''}</td>
      <td>${e.desc}</td>
      <td class="td-qty">${e.qty || ''}</td>
      <td class="td-price">${e.price ? fmt(e.price) : ''}</td>
      ${incomeCell}
      <td class="td-amt td-balance ${runBal < 0 ? 'neg' : ''}">${fmt(runBal)}</td>
      <td class="td-note">${e.note || ''}</td>
      <td class="td-photo">
        ${e.photo
          ? `<img src="${e.photo}" onclick="viewPhoto('${e.id}')" title="點擊放大"
              style="height:36px;width:48px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid #ddd">`
          : (e.type==='expense'
              ? `<label style="cursor:pointer;font-size:11px;color:#888;padding:3px 6px;border:1px dashed #ccc;border-radius:4px">
                  📷<input type="file" accept="image/*" style="display:none"
                    onchange="uploadPhoto(event,${e.id})"></label>`
              : '')
        }
      </td>
      <td class="td-actions">
        <button class="icon-btn" onclick="openEdit(${e.id})" title="編輯">✎</button>
        <button class="icon-btn" onclick="deleteEntry(${e.id})" title="刪除" style="color:#c0392b">✕</button>
      </td>`;
    body.appendChild(tr);
  });

  if (!entries.length) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    tr.innerHTML = '<td colspan="11">本月尚無明細，請點「新增明細」開始記帳</td>';
    body.appendChild(tr);
  }

  // ── Footer row ──
  const totalIncome = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amt, 0);
  const totalExpense = entries.filter(e => e.type === 'expense').reduce((s, e) => s + vAmt(e), 0);
  const endBalance = sheet.carry + totalIncome - totalExpense;

  const foot = document.getElementById('ledgerFoot');
  foot.innerHTML = `<tr class="subtotal-row">
    <td colspan="3" style="text-align:center">合　計</td>
    <td></td><td></td><td></td>
    <td class="td-amt td-income">${fmt(totalIncome)}</td>
    <td class="td-amt td-expense">${fmt(totalExpense)}</td>
    <td class="td-amt td-balance ${endBalance < 0 ? 'neg' : ''}">${fmt(endBalance)}</td>
    <td colspan="2"></td>
  </tr>`;

  // ── Summary cards ──
  document.getElementById('sumIncome').textContent = fmt(totalIncome);
  document.getElementById('sumExpense').textContent = fmt(totalExpense);
  document.getElementById('sumBalance').textContent = fmt(endBalance);
  document.getElementById('sumCarry').textContent = fmt(sheet.carry);
  const balCard = document.getElementById('balCard');
  balCard.classList.toggle('negative', endBalance < 0);

  // ── Footer text ──
  // Count photos for this month
  const photoCount = entries.filter(e => e.type==='expense' && e.photo).length;
  document.getElementById('sheetFooter').innerHTML =
    `<span>${m}月支出金額 <strong>${fmt(totalExpense)}</strong> 元，結餘 <strong class="${endBalance < 0 ? 'td-balance neg' : ''}">${fmt(endBalance)}</strong> 元</span>
     <span style="display:flex;align-items:center;gap:12px">
       <button class="btn btn-outline" onclick="openPhotoGallery()"
         style="padding:5px 14px;font-size:13px">
         🖼 顯示照片${photoCount > 0 ? ` (${photoCount})` : ''}
       </button>
       <span>製表：林智仁　｜　平安診所岱江里C據點</span>
     </span>`;
}

function fmt(n) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('zh-TW');
}

// ── Modals ─────────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

// ── Add / Edit Entry ───────────────────────────────────────────────────────
function openAdd() {
  if (!currentKey) return alert('請先選擇月份');
  editId = null;
  document.getElementById('modalTitle').textContent = '新增明細';
  // Default date = today
  const today = new Date();
  const [y, m] = currentKey.split('-');
  const yr = 1911 + parseInt(y);
  const iso = `${yr}-${String(m).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('fDate').value = iso;
  document.getElementById('fType').value = 'expense';
  document.getElementById('fDesc').value = '';
  document.getElementById('fVoucher').value = '';
  document.getElementById('fVoucherAmt').value = '';
  document.getElementById('fQty').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fAmt').value = '';
  document.getElementById('fNote').value = '';
  onTypeChange();
  openModal('entryModal');
}

function openEdit(id) {
  const entry = db[currentKey].entries.find(e => e.id === id);
  if (!entry) return;
  editId = id;
  document.getElementById('modalTitle').textContent = '編輯明細';
  document.getElementById('fDate').value = entry.date;
  document.getElementById('fType').value = entry.type;
  document.getElementById('fDesc').value = entry.desc;
  document.getElementById('fVoucher').value = entry.voucher || '';
  document.getElementById('fVoucherAmt').value = entry.voucherAmt || '';
  document.getElementById('fQty').value = entry.qty || '';
  document.getElementById('fPrice').value = entry.price || '';
  document.getElementById('fAmt').value = entry.amt || '';
  document.getElementById('fNote').value = entry.note || '';
  onTypeChange();

}

function onTypeChange() {
  const t = document.getElementById('fType').value;
  const isIncome = t === 'income';
  const isNote = t === 'note';
  document.getElementById('grpQty').style.opacity = isIncome || isNote ? '.4' : '1';
  document.getElementById('grpPrice').style.opacity = isIncome || isNote ? '.4' : '1';
  document.getElementById('amtLabel').textContent =
    isIncome ? '收入金額' : isNote ? '金額（備查，不計入）' : '金額（自動計算）';
}

function calcAmt() {
  const q = parseFloat(document.getElementById('fQty').value) || 0;
  const p = parseFloat(document.getElementById('fPrice').value) || 0;
  if (q && p) document.getElementById('fAmt').value = q * p;
}

function saveEntry() {
  const type = document.getElementById('fType').value;
  const desc = document.getElementById('fDesc').value.trim();
  if (!desc) return alert('請輸入摘要');
  const amt = parseFloat(document.getElementById('fAmt').value) || 0;

  const entry = {
    id: editId || Date.now(),
    date: document.getElementById('fDate').value,
    type,
    desc,
    voucher: document.getElementById('fVoucher').value.trim(),
    voucherAmt: parseFloat(document.getElementById('fVoucherAmt').value) || 0,
    qty: parseFloat(document.getElementById('fQty').value) || 0,
    price: parseFloat(document.getElementById('fPrice').value) || 0,
    amt,
    note: document.getElementById('fNote').value.trim(),
  };

  if (editId) {
    const idx = db[currentKey].entries.findIndex(e => e.id === editId);
    if (idx >= 0) db[currentKey].entries[idx] = entry;
  } else {
    db[currentKey].entries.push(entry);
  }

  save();
  closeModal('entryModal');
  renderSheet();
}

function deleteEntry(id) {
  if (!confirm('確定刪除此筆明細？')) return;
  db[currentKey].entries = db[currentKey].entries.filter(e => e.id !== id);
  save();
  renderSheet();
}

function openCarry() {

// ── Add Month ──────────────────────────────────────────────────────────────
function addMonth() {
  const now = new Date();
  // Convert to ROC year
  document.getElementById('mYear').value = now.getFullYear() - 1911;
  document.getElementById('mMonth').value = now.getMonth() + 1;
  openModal('addMonthModal');
}

function confirmAddMonth() {
  const y = parseInt(document.getElementById('mYear').value);
  const m = parseInt(document.getElementById('mMonth').value);
  if (!y || !m) return alert('請輸入年份與月份');
  const k = `${y}-${m}`;
  if (db[k]) { alert('此月份已存在'); closeModal('addMonthModal'); selectMonth(k); return; }

  // Find previous month balance
  const prevKey = `${m === 1 ? y-1 : y}-${m === 1 ? 12 : m-1}`;
  const prevSheet = db[prevKey];
  let prevBal = 0;
  if (prevSheet) {
    const ents = prevSheet.entries || [];
    prevBal = prevSheet.carry + ents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amt,0)
                             - ents.filter(e=>e.type==='expense').reduce((s,e)=>s+(e.voucherAmt||0),0);
  }

  db[k] = {
    carry: prevBal,
    carryLabel: `${m === 1 ? 12 : m-1}月份結餘`,
    entries: []
  };
  save();
  closeModal('addMonthModal');
  renderSidebar();
  selectMonth(k);
}

// ── Export CSV ─────────────────────────────────────────────────────────────
function exportCSV() {
  if (!currentKey) return;
  const sheet = db[currentKey];
  const [y, m] = currentKey.split('-');
  const rows = [['日期','憑證編號','憑證金額','摘要','數量','單價','收入金額','支出金額','結餘','備註']];

  let runBal = sheet.carry;
  rows.push(['','','', sheet.carryLabel || '上月結餘','','','','',runBal,'']);

  const entries = [...sheet.entries].sort((a,b)=>a.date.localeCompare(b.date));
  entries.forEach(e => {
    if (e.type === 'income') runBal += e.amt;
    else if (e.type === 'expense') runBal -= (e.voucherAmt || 0);
    const d = e.date ? new Date(e.date+'T00:00:00') : null;
    const ds = d ? `${d.getMonth()+1}月${d.getDate()}日` : '';
    rows.push([ds, e.voucher||'', e.voucherAmt||'', e.desc,
      e.qty||'', e.price||'',
      e.type==='income' ? e.amt : '',
      e.type==='expense' ? e.amt : '',
      runBal, e.note||'']);
  });

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `岱江里C據點_${y}年${m}月收支.csv`;
  a.click();
}

// ── Import CSV ───────────────────────────────────────────────────────────────
function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Infer month key from filename e.g. 岱江里C據點_115年6月收支.csv
  let inferredKey = null;
  const fnm = file.name.match(/(\d{3})年(\d{1,2})月/);
  if (fnm) inferredKey = `${fnm[1]}-${parseInt(fnm[2])}`;

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.replace(/^﻿/, ''); // strip BOM
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);

    // Parse CSV rows
    function parseRow(line) {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"' && !inQ) { inQ = true; }
        else if (c === '"' && inQ && line[i+1] === '"') { cur += '"'; i++; }
        else if (c === '"' && inQ) { inQ = false; }
        else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
        else cur += c;
      }
      cols.push(cur);
      return cols;
    }

    const hdr = parseRow(lines[0]);
    // Expected: 日期,憑證編號,憑證金額,摘要,數量,單價,收入金額,支出金額,結餘,備註

    let carry = 0, carryLabel = '上月結餘', entries = [], key = inferredKey;
    let eid = Date.now();

    for (let i = 1; i < lines.length; i++) {
      const cols = parseRow(lines[i]);
      const [dateStr, voucher, vamt, desc, qty, price, incAmt, expAmt, bal, note] = cols;

      // carry row: no date, desc contains 結餘
      if (!dateStr && desc && desc.includes('結餘')) {
        carry = parseFloat(bal?.replace(/,/g,'')) || 0;
        carryLabel = desc;
        continue;
      }
      // subtotal row
      if (desc === '合　計' || desc === '合計') continue;
      if (!desc) continue;

      const incV  = parseFloat(incAmt?.replace(/,/g,'')) || 0;
      const expV  = parseFloat(expAmt?.replace(/,/g,'')) || 0;
      const type  = incV > 0 ? 'income' : 'expense';
      const amt   = type === 'income' ? incV : expV;

      // Parse date "6月11日" → ISO
      let isoDate = '';
      const dm = dateStr?.match(/(\d+)月(\d+)日/);
      if (dm && key) {
        const [ky, km] = key.split('-');
        isoDate = `${1911+parseInt(ky)}-${String(dm[1]).padStart(2,'0')}-${String(dm[2]).padStart(2,'0')}`;
      }

      entries.push({
        id: eid++,
        date: isoDate,
        type,
        desc: desc || '',
        voucher: voucher || '',
        voucherAmt: parseFloat(vamt?.replace(/,/g,'')) || 0,
        qty: parseFloat(qty?.replace(/,/g,'')) || 0,
        price: parseFloat(price?.replace(/,/g,'')) || 0,
        amt,
        note: note || ''
      });
    }

    if (!key) {
      // Ask user which month
      const input = prompt('無法從檔名判斷月份，請輸入月份（如 115-6）：');
      if (!input) return;
      key = input.trim();
    }

    if (!db[key]) db[key] = { carry: 0, carryLabel: '上月結餘', entries: [] };
    const overwrite = db[key].entries.length > 0
      ? confirm(`「${keyLabel(key)}」已有 ${db[key].entries.length} 筆資料，是否覆蓋？`)
      : true;
    if (!overwrite) return;

    db[key] = { carry, carryLabel, entries };
    save();
    renderSidebar();
    selectMonth(key);
    alert(`✓ 已匯入「${keyLabel(key)}」共 ${entries.length} 筆，期初結餘 ${fmt(carry)}`);
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = ''; // reset input
}

// Compress image to base64 (max 800px, quality 0.7)
function compressImage(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(event, entryId) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('照片不能超過 10MB'); return; }

  try {
    const b64 = await compressImage(file, 800, 0.72);
    const entry = db[currentKey].entries.find(e => e.id === entryId);
    if (!entry) return;
    entry.photo = b64;
    save();
    renderSheet();
  } catch(e) {
    alert('照片上傳失敗：' + e.message);
  }
}

// ── Start ──────────────────────────────────────────────────────────────────
// Compare local vs cloud; never silently discard local data that has more entries
function countEntries(d) {
  if (!d) return 0;
  return Object.values(d).reduce((s, m) => s + (m.entries ? m.entries.length : 0), 0);
}

const localSnapshot = JSON.parse(JSON.stringify(db)); // db already loaded from local seed/storage above
const localCount = countEntries(localSnapshot);

fbDb.ref(FB_PATH).once('value')
  .then(snapshot => {
    const cloud = snapshot.val();
    const cloudCount = countEntries(cloud);

    if (!cloud || cloudCount === 0) {
      // No cloud data — push local up
      setSyncStatus('✓ 已連線雲端（尚無資料）', '#7bed9f');
      fbDb.ref(FB_PATH).set(db).catch(()=>{});
    } else if (cloudCount >= localCount) {
      // Cloud has same or more data — safe to use cloud as source of truth
      db = cloud;
      storage.setItem(KEY, JSON.stringify(db));
      setSyncStatus('✓ 已從雲端載入', '#7bed9f');
    } else {
      // Local has MORE entries than cloud — local is ahead (e.g. entries made
      // right before closing the page didn't finish syncing). Keep local and
      // push it up instead of overwriting with stale cloud data.
      setSyncStatus('⚠ 本機資料較新，已上傳補齊雲端', '#f0c040');
      fbDb.ref(FB_PATH).set(db).catch(()=>{});
    }
    fbReady = true;
    normalizeDb();
    init();

    // Listen for live updates from other devices
    let _writing = false; // lock: ignore updates triggered by our own saves
    window._fbWriteLock = (v) => { _writing = v; };
    fbDb.ref(FB_PATH).on('value', snapshot => {
      if (_writing) return; // our own write, skip
      const cloud = snapshot.val();
      if (!cloud) return;
      const cloudStr = JSON.stringify(cloud);
      if (cloudStr !== JSON.stringify(db)) {
        if (countEntries(cloud) >= countEntries(db)) {
          db = cloud;
          normalizeDb();
          storage.setItem(KEY, JSON.stringify(db));
          renderSidebar();
          if (currentKey) renderSheet();
          setSyncStatus('✓ 已更新（其他裝置同步）', '#7bed9f');
        }
      }
    });
  })
  .catch(err => {
    setSyncStatus('✗ 雲端連線失敗，使用本機資料', '#ff6b6b');
    fbReady = false;
    init();
  });
</script>
